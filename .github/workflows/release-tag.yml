# Tags a release of the core when a merged pull request raises VERSION, with
# the workflow that repositories of modules call too. Apps pin these tags. See
# docs/decisions/0134-release-tags-from-a-version-file.md.

name: Release tag
# Pull request runs lead with the number. Other runs keep GitHub's default
# title, because an empty run-name means the default.
run-name: ${{ github.event_name == 'pull_request' && format('#{0} {1}', github.event.pull_request.number, github.event.pull_request.title) || '' }}

on:
  push:
    branches: [master]
  pull_request:
    paths: [VERSION, CHANGELOG.md]
  # The merge queue waits for the checks that a pull request had.
  merge_group:

permissions:
  contents: read

jobs:
  tag:
    permissions:
      contents: write
    uses: ./.github/workflows/tag-release.yml
