# Builds, tests and packages an app repository on Windows, macOS and Linux, for
# a repository that holds a manifest and a CMakePresets.json with a preset "ci".
# An app calls it with one short workflow:
#
#   jobs:
#     build:
#       uses: rrgmc/mirante-core/.github/workflows/build-app.yml@<the manifest's core ref>
#
# GitHub needs a literal ref there, so the core's pin is in two places, and the
# first step fails if they differ. This job holds no secrets, so the code of a
# module cannot reach any. See docs/plans/custom-builds.md, parts 3 and 6.

name: Build app

on:
  workflow_call:
    inputs:
      manifest:
        description: The path of the manifest
        type: string
        default: mirante.json
      check-modules:
        description: Check that the repository's modules include only their own files and the module interface, and that their texts are translated
        type: boolean
        default: false

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  CTEST_PARALLEL_LEVEL: 4
  MANIFEST: ${{ inputs.manifest }}

jobs:
  build:
    name: build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    steps:
      - uses: actions/checkout@v4

      - name: Find the core's pin
        id: core
        shell: bash
        run: |
          repo=$(jq -r .core.repo "$MANIFEST" | tr -d '\r' | sed -e 's#^https://github.com/##' -e 's#\.git$##')
          ref=$(jq -r .core.ref "$MANIFEST" | tr -d '\r')
          used=$(grep -rhoE 'mirante-core/\.github/workflows/build-app\.yml@[^ ]+' .github/workflows | tr -d '\r' | sed 's/.*@//' | sort -u)
          if [ "$used" != "$ref" ]; then
            echo "::error::The workflow uses build-app.yml@$used, but $MANIFEST pins the core to $ref. Change both."
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "qt=$(jq -r '.qt | join("-")' "$MANIFEST" | tr -d '\r')" >> "$GITHUB_OUTPUT"

      # The scripts that get Qt and make the package. The build fetches the core
      # by itself, from the same pin.
      - uses: actions/checkout@v4
        with:
          repository: ${{ steps.core.outputs.repo }}
          ref: ${{ steps.core.outputs.ref }}
          path: .mirante-core
          persist-credentials: false

      - name: Check module includes
        if: inputs.check-modules && runner.os == 'Linux'
        run: python3 .mirante-core/tools/check-module-includes.py .

      - uses: astral-sh/setup-uv@v6

      - name: Cache Qt
        uses: actions/cache@v4
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-${{ steps.core.outputs.qt }}

      - name: Cache compiling
        uses: hendrikmuhs/ccache-action@v1.2
        with:
          key: ${{ matrix.os }}-app-no-pch
          max-size: 500M
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 dpkg-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
        run: ./.mirante-core/tools/build.ps1 -Source . -Manifest "$env:MANIFEST" -Preset ci -NoPch -Package

      - name: Build and test (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh .mirante-core/tools/setup-qt.sh "$MANIFEST")
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR" -DMIRANTE_PCH=OFF
          cmake --build --preset ci
          ctest --preset ci

      # The committed files must be up to date and complete.
      - name: Check module translations
        if: inputs.check-modules && runner.os == 'Linux'
        run: |
          cmake --build --preset ci --target update_translations
          python3 .mirante-core/tools/check-translations.py .
          git diff --exit-code -- '*/translations/*'
          test -z "$(git status --porcelain -- '*/translations/*')"

      - name: Package (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --install build/ci --component Mirante --prefix "$PWD/build/ci/install"
          python3 .mirante-core/tools/check-package.py build/ci/install "$MANIFEST"
          cd build/ci && cpack

      - uses: actions/upload-artifact@v4
        with:
          name: mirante-${{ runner.os }}
          path: |
            build/ci/mirante-*-win64.exe
            build/ci/mirante-*-macos.dmg
            build/ci/mirante_*.deb
          if-no-files-found: error
          retention-days: 7
