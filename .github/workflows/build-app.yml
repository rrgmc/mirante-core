# Builds, tests and packages an app repository on Windows, macOS and Linux, for
# a repository that holds a manifest and a CMakePresets.json with a preset "ci".
# An app calls it with one short workflow:
#
#   jobs:
#     build:
#       uses: rrgmc/mirante-core/.github/workflows/build-app.yml@<the manifest's core ref>
#
# GitHub needs a literal ref there, so the core's pin is in two places, and the
# first job fails if they differ.
#
# With release-new-version, a push to the default branch that raised
# MIRANTE_VERSION builds a release, and the output release-tag tells the caller
# to call release-app.yml. mirante-app-template shows this.
#
# The build jobs hold no secrets, so the code of a module cannot reach any. On
# macOS, the build job makes the disk image itself, signed ad hoc, unless
# macos-signing is developer-id. Then a separate job signs the finished bundle
# with the Developer ID and runs nothing from the build. release-app.yml
# publishes the packages. See docs/decisions/0126-macos-signing-is-a-separate-job.md
# and docs/decisions/0155-ad-hoc-disk-image-in-the-build-job.md.

name: Build app

on:
  workflow_call:
    inputs:
      manifest:
        description: The path of the manifest
        type: string
        default: mirante.json
      enable-modules:
        description: The ids of optional modules of the manifest to build too, separated by spaces
        type: string
        default: ''
      check-modules:
        description: Check that the repository's modules include only their own files and the module interface, and that their texts are translated
        type: boolean
        default: false
      macos-signing:
        description: none signs ad hoc. developer-id signs and notarises with the secrets of the environment "release", which the caller passes with secrets inherit
        type: string
        default: none
      release-tag:
        description: Build for this tag, vX.Y.Z or vX.Y.Z-rc.N, which gives the version. release-app.yml then publishes it
        type: string
        default: ''
      release-new-version:
        description: On a push to the default branch, build for the tag vX.Y.Z of MIRANTE_VERSION in CMakeLists.txt if that tag does not exist yet. The output release-tag names it
        type: boolean
        default: false
    outputs:
      release-tag:
        description: The tag this run built for, or empty
        value: ${{ jobs.prepare.outputs.release-tag }}
      edition:
        description: The manifest's edition, or empty. release-app.yml takes it for the release's title
        value: ${{ jobs.prepare.outputs.edition }}

permissions:
  contents: read

env:
  QT_VERSION: 6.8.3
  CTEST_PARALLEL_LEVEL: 4
  MANIFEST: ${{ inputs.manifest }}
  ENABLE_MODULES: ${{ inputs.enable-modules }}

jobs:
  prepare:
    runs-on: ubuntu-24.04
    outputs:
      core-repo: ${{ steps.core.outputs.repo }}
      core-ref: ${{ steps.core.outputs.ref }}
      qt: ${{ steps.core.outputs.qt }}
      version: ${{ steps.version.outputs.version }}
      release-tag: ${{ steps.version.outputs.tag }}
      edition: ${{ steps.core.outputs.edition }}
    steps:
      - uses: actions/checkout@v7
        with:
          # The tags, to tell whether a version was released.
          fetch-depth: 0

      - name: Find the core's pin
        id: core
        run: |
          repo=$(jq -r .core.repo "$MANIFEST" | sed -e 's#^https://github.com/##' -e 's#\.git$##')
          ref=$(jq -r .core.ref "$MANIFEST")
          used=$(grep -rhoE 'mirante-core/\.github/workflows/[a-z-]+\.yml@[^ ]+' .github/workflows | tr -d '\r' | sed 's/.*@//' | sort -u)
          if [ "$used" != "$ref" ]; then
            echo "::error::The workflows use the core's workflows at $used, but $MANIFEST pins the core to $ref. Change both."
            exit 1
          fi
          echo "repo=$repo" >> "$GITHUB_OUTPUT"
          echo "ref=$ref" >> "$GITHUB_OUTPUT"
          echo "qt=$(jq -r '.qt | join("-")' "$MANIFEST")" >> "$GITHUB_OUTPUT"
          # The build checks it too. It goes into file names, so it is checked
          # here before any job uses it.
          edition=$(jq -r '.edition // ""' "$MANIFEST")
          if [ -n "$edition" ] && [[ ! "$edition" =~ ^[a-z0-9]([a-z0-9-]{0,30}[a-z0-9])?$ ]]; then
            echo "::error::$MANIFEST has the edition '$edition', which must have lowercase letters, digits and - only."
            exit 1
          fi
          echo "edition=$edition" >> "$GITHUB_OUTPUT"

      - name: Check the modules to enable
        run: |
          for module in $ENABLE_MODULES; do
            if [[ ! "$module" =~ ^[a-z0-9]+$ ]]; then
              echo "::error::enable-modules names '$module', which is not a module id."
              exit 1
            fi
          done

      - name: Version from the release tag
        id: version
        env:
          TAG: ${{ inputs.release-tag }}
          NEW_VERSION: ${{ inputs.release-new-version && github.event_name == 'push' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) }}
        run: |
          # A merged update raises MIRANTE_VERSION, so its first build on the
          # default branch publishes it. See decision 0127.
          if [ -z "$TAG" ] && [ "$NEW_VERSION" = true ]; then
            version=$(sed -nE 's/^set\(MIRANTE_VERSION "([0-9]+\.[0-9]+\.[0-9]+)".*/\1/p' CMakeLists.txt | head -n 1)
            if [ -z "$version" ]; then
              echo "::error::CMakeLists.txt sets no MIRANTE_VERSION \"X.Y.Z\"."
              exit 1
            fi
            if git rev-parse -q --verify "refs/tags/v$version" > /dev/null; then
              echo "v$version is released already, so this build publishes nothing."
            else
              TAG="v$version"
            fi
          fi
          if [ -z "$TAG" ]; then
            exit 0
          fi
          if [[ ! "$TAG" =~ ^v([0-9]+\.[0-9]+\.[0-9]+)(-rc\.[0-9]+)?$ ]]; then
            echo "::error::Release tag '$TAG' is not vX.Y.Z or vX.Y.Z-rc.N"
            exit 1
          fi
          echo "version=${BASH_REMATCH[1]}" >> "$GITHUB_OUTPUT"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  build:
    name: build (${{ matrix.os }})
    needs: prepare
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2022, macos-15, ubuntu-24.04]
    env:
      VERSION: ${{ needs.prepare.outputs.version }}
    steps:
      - uses: actions/checkout@v7

      # The scripts that get Qt and make the package. The build fetches the core
      # by itself, from the same pin.
      - uses: actions/checkout@v7
        with:
          repository: ${{ needs.prepare.outputs.core-repo }}
          ref: ${{ needs.prepare.outputs.core-ref }}
          path: .mirante-core
          persist-credentials: false

      - name: Check module includes
        if: inputs.check-modules && runner.os == 'Linux'
        run: python3 .mirante-core/tools/check-module-includes.py .

      # The app repository's own modules, from "local" in the manifest. See
      # decision 0130.
      - name: Check local module includes
        if: runner.os == 'Linux'
        run: |
          jq -r '.modules[] | select(.local) | .local as $local | .folders[]
                 | (if type == "string" then . else .folder end) | "\($local)/\(.)"' "$MANIFEST" |
            while read -r folder; do
              python3 .mirante-core/tools/check-module-includes.py "$folder"
            done

      # A repository that writes its changelog from fragments. See decision
      # 0154.
      - name: Check changelog fragments
        if: runner.os == 'Linux' && hashFiles('changelog.d/**') != ''
        run: python3 .mirante-core/tools/release-changelog.py --root . check

      - uses: astral-sh/setup-uv@v10.3.3
        with:
          # uv only runs tools. There are no Python dependencies to cache.
          enable-cache: false

      - name: Cache Qt
        uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/qt
          key: qt-${{ runner.os }}-${{ env.QT_VERSION }}-qtbase-qtsvg-qtdeclarative-qttools-qttranslations-icu-webengine-imageformats-${{ needs.prepare.outputs.qt }}

      - name: Cache compiling
        uses: hendrikmuhs/ccache-action@v1.2.24
        with:
          key: ${{ matrix.os }}-app-no-pch
          max-size: 500M
          save: ${{ github.event_name == 'push' }}

      - name: Install Linux packages
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            ninja-build pkg-config libsecret-1-dev libx11-dev libxkbcommon-dev \
            libxkbcommon-x11-0 libgl1-mesa-dev libegl1 libfontconfig1 libdbus-1-3 \
            libnss3 libnspr4 libxcomposite1 libxdamage1 libxrandr2 libxtst6 \
            libxkbfile1 libxshmfence1 libgbm1 libdrm2 libasound2t64 libxcb-cursor0 \
            libxcb-icccm4 libxcb-keysyms1 libxcb-shape0 dpkg-dev

      - name: Install macOS packages
        if: runner.os == 'macOS'
        run: brew install ninja

      - name: Install NSIS (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: if (-not (Get-Command makensis -ErrorAction SilentlyContinue)) { choco install nsis -y --no-progress }

      - name: Build, test and package (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
        run: |
          $enable = @(-split "$env:ENABLE_MODULES")
          ./.mirante-core/tools/build.ps1 -Source . -Manifest "$env:MANIFEST" -Version "$env:VERSION" -Preset ci -NoPch -Package -EnableModules $enable

      # Universal on macOS, for Apple silicon and Intel. See decision 0101.
      - name: Build and test (macOS, Linux)
        if: runner.os != 'Windows'
        env:
          MIRANTE_QT_ROOT: ${{ runner.temp }}/qt
          # Ubuntu 24.04 blocks the user namespaces that Chromium's sandbox
          # needs. Tests load data: URLs only.
          QTWEBENGINE_DISABLE_SANDBOX: 1
        run: |
          QT_DIR=$(sh .mirante-core/tools/setup-qt.sh "$MANIFEST")
          if [ "$RUNNER_OS" = macOS ]; then
            set -- "-DCMAKE_OSX_ARCHITECTURES=arm64;x86_64"
          else
            set --
          fi
          for module in $ENABLE_MODULES; do
            set -- "$@" "-DMIRANTE_MODULE_$(echo "$module" | tr '[:lower:]' '[:upper:]')=ON"
          done
          cmake --preset ci -DCMAKE_PREFIX_PATH="$QT_DIR" -DMIRANTE_PCH=OFF \
            ${VERSION:+"-DMIRANTE_VERSION=$VERSION"} "$@"
          cmake --build --preset ci
          ctest --preset ci

      # Extensions follow the rules of modules: their own files and the module
      # interface only. Configuration lists their folders. See decision 0132.
      - name: Check extension includes
        if: runner.os == 'Linux'
        run: |
          while read -r folder; do
            if [ -n "$folder" ]; then
              python3 .mirante-core/tools/check-module-includes.py "$folder"
            fi
          done < build/ci/mirante-extension-folders.txt

      # A report for reviews, on the run's summary page. It never fails.
      - name: Scan modules for sensitive APIs
        if: runner.os == 'Linux'
        run: python3 .mirante-core/tools/scan-module-apis.py --build build/ci >> "$GITHUB_STEP_SUMMARY"

      # The committed files must be up to date and complete.
      - name: Check module translations
        if: inputs.check-modules && runner.os == 'Linux'
        run: |
          cmake --build --preset ci --target update_translations
          python3 .mirante-core/tools/check-translations.py .
          git diff --exit-code -- '*/translations/*'
          test -z "$(git status --porcelain -- '*/translations/*')"

      - name: Install and check (macOS, Linux)
        if: runner.os != 'Windows'
        run: |
          cmake --install build/ci --component Mirante --prefix "$PWD/build/ci/install"
          python3 .mirante-core/tools/check-package.py build/ci/install "$MANIFEST"

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: cd build/ci && cpack

      # Without the Developer ID, the bundle that the install signed ad hoc goes
      # straight into the disk image, so no second macOS job waits for a
      # runner. See decision 0155.
      - name: Make the disk image (macOS)
        if: runner.os == 'macOS' && inputs.macos-signing != 'developer-id'
        env:
          EDITION: ${{ needs.prepare.outputs.edition }}
        run: |
          version=$(grep '^MIRANTE_VERSION:STRING=' build/ci/CMakeCache.txt | cut -d= -f2)
          sh .mirante-core/tools/package-macos.sh build/ci/install             "build/ci/mirante${EDITION:+-$EDITION}-$version-macos.dmg"

      # For the signing job. A zip would lose the symbolic links inside Qt's
      # frameworks, so the bundle travels as a tar file. The signing job needs
      # the version for the disk image's name.
      - name: Pack the bundle (macOS)
        if: runner.os == 'macOS' && inputs.macos-signing == 'developer-id'
        run: |
          grep '^MIRANTE_VERSION:STRING=' build/ci/CMakeCache.txt | cut -d= -f2 > build/ci/version.txt
          tar -cf build/ci/mirante-bundle.tar -C build/ci/install .

      - uses: actions/upload-artifact@v7
        if: runner.os != 'macOS' || inputs.macos-signing != 'developer-id'
        with:
          name: mirante-${{ runner.os }}
          path: |
            build/ci/mirante-*-win64.exe
            build/ci/mirante*-macos.dmg
            build/ci/mirante*_*.deb
          if-no-files-found: error
          retention-days: 7

      - uses: actions/upload-artifact@v7
        if: runner.os == 'macOS' && inputs.macos-signing == 'developer-id'
        with:
          name: mirante-macOS-bundle
          path: |
            build/ci/mirante-bundle.tar
            build/ci/version.txt
          if-no-files-found: error
          retention-days: 7

  # Runs nothing from the build, and reads no cache, so what a module built
  # cannot reach the certificate. The bundle and its version are data here.
  # Only for the Developer ID; otherwise the build job made the disk image.
  sign-macos:
    needs: [prepare, build]
    if: inputs.macos-signing == 'developer-id'
    runs-on: macos-15
    environment: release
    env:
      EDITION: ${{ needs.prepare.outputs.edition }}
    steps:
      # Pinned to commits: this job can hold the signing secrets.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ needs.prepare.outputs.core-repo }}
          ref: ${{ needs.prepare.outputs.core-ref }}
          path: core
          persist-credentials: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: mirante-macOS-bundle
          path: bundle

      - name: Unpack the bundle
        run: |
          version=$(cat bundle/version.txt)
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "::error::The build gave the version '$version'"
            exit 1
          fi
          echo "DMG=mirante${EDITION:+-$EDITION}-$version-macos.dmg" >> "$GITHUB_ENV"
          mkdir install
          tar -xf bundle/mirante-bundle.tar -C install

      # A keychain of its own, with a random password, holds the Developer ID
      # certificate for this job only. The last step deletes it.
      - name: Import the signing certificate
        env:
          CERTIFICATE_P12: ${{ secrets.MACOS_CERTIFICATE_P12 }}
          CERTIFICATE_PASSWORD: ${{ secrets.MACOS_CERTIFICATE_PASSWORD }}
        run: |
          keychain="$RUNNER_TEMP/signing.keychain-db"
          keychain_password=$(openssl rand -base64 24)
          echo "::add-mask::$keychain_password"
          umask 077
          echo "$CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/certificate.p12"
          security create-keychain -p "$keychain_password" "$keychain"
          security set-keychain-settings -lut 7200 "$keychain"
          security unlock-keychain -p "$keychain_password" "$keychain"
          security import "$RUNNER_TEMP/certificate.p12" -k "$keychain" \
            -P "$CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/certificate.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s \
            -k "$keychain_password" "$keychain" > /dev/null
          security list-keychains -d user -s "$keychain" \
            $(security list-keychains -d user | tr -d '"')

      - name: Sign the bundle and make the disk image
        run: |
          sh core/tools/sign-macos.sh install/mirante.app "Developer ID Application" core/resources/macos/webengine.entitlements
          sh core/tools/package-macos.sh install "$DMG"

      - name: Notarise the disk image
        env:
          NOTARY_API_KEY: ${{ secrets.NOTARY_API_KEY }}
          MIRANTE_NOTARY_KEY: ${{ runner.temp }}/notary.p8
          MIRANTE_NOTARY_KEY_ID: ${{ secrets.NOTARY_API_KEY_ID }}
          MIRANTE_NOTARY_ISSUER: ${{ secrets.NOTARY_API_ISSUER }}
        run: |
          umask 077
          printf '%s\n' "$NOTARY_API_KEY" > "$MIRANTE_NOTARY_KEY"
          sh core/tools/notarise-macos.sh "$DMG" "Developer ID Application"

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mirante-macOS
          path: ${{ env.DMG }}
          if-no-files-found: error
          retention-days: 7

      - name: Remove the signing keychain and key
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/signing.keychain-db" || true
          rm -f "$RUNNER_TEMP/notary.p8"
