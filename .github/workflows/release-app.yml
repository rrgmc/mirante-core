# Publishes the packages that build-app.yml made in the same run, for a tag vX.Y.Z,
# or vX.Y.Z-rc.N as a prerelease. If the tag does not exist, the release makes it
# on the commit of the run. Its notes are the version's section of the app's
# CHANGELOG.md, when it has one, or else GitHub's list of merged pull requests. It is separate from build-app.yml because only
# this job may write to the repository, and GitHub refuses a whole workflow whose
# caller does not grant what any of its jobs asks for. It builds nothing. An app's
# tag workflow calls it after build-app.yml:
#
#   jobs:
#     build:
#       uses: rrgmc/mirante-core/.github/workflows/build-app.yml@<the manifest's core ref>
#       with:
#         release-tag: ${{ github.ref_name }}
#     publish:
#       needs: build
#       permissions:
#         contents: write
#       uses: rrgmc/mirante-core/.github/workflows/release-app.yml@<the same ref>
#       with:
#         tag: ${{ github.ref_name }}
#         edition: ${{ needs.build.outputs.edition }}
#
# See docs/decisions/0126-macos-signing-is-a-separate-job.md.

name: Release app

on:
  workflow_call:
    inputs:
      tag:
        description: The tag to publish a release for, which build-app.yml has checked
        type: string
        required: true
      edition:
        description: The manifest's edition, from build-app.yml's output edition, for the release's title. Empty for none
        type: string
        default: ''

jobs:
  publish:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: mirante-*
          merge-multiple: true
          path: packages

      # Only the changelog, for the release's notes. Nothing of the app runs.
      - uses: actions/checkout@v7
        with:
          sparse-checkout: CHANGELOG.md
          sparse-checkout-cone-mode: false
          path: app
          persist-credentials: false

      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.tag }}
          EDITION: ${{ inputs.edition }}
        run: |
          title="Mirante${EDITION:+ $EDITION} $TAG"
          rm -f packages/mirante-bundle.tar packages/version.txt
          ls -l packages
          if ! gh release view "$TAG" > /dev/null 2>&1; then
            flags=()
            if [[ "$TAG" == *-rc.* ]]; then
              flags+=(--prerelease)
            fi
            # A pushed tag is used as it is. Otherwise, as after a merged
            # update, the release makes the tag on the built commit.
            if gh api "repos/$GH_REPO/git/ref/tags/$TAG" > /dev/null 2>&1; then
              flags+=(--verify-tag)
            else
              flags+=(--target "$GITHUB_SHA")
            fi
            # The notes are the version's section of the app's changelog, in
            # the format of Keep a Changelog, or else GitHub's list of the
            # merged pull requests. A prerelease vX.Y.Z-rc.N takes the section
            # of X.Y.Z.
            version="${TAG#v}"
            version="${version%%-*}"
            notes="$RUNNER_TEMP/notes.md"
            if [ -f app/CHANGELOG.md ]; then
              awk -v heading="## [$version]" '
                index($0, heading) == 1 { on = 1; next }
                on && /^## \[/ { exit }
                on && /^\[[^]]+\]: / { next }
                on { print }
              ' app/CHANGELOG.md |
                perl -pe 's#\]\((?!https?://|\#)([^)]+)\)#](https://github.com/'"$GH_REPO"'/blob/'"$TAG"'/$1)#g' \
                > "$notes"
            fi
            if [ -s "$notes" ] && grep -q '[^[:space:]]' "$notes"; then
              flags+=(--notes-file "$notes")
            else
              flags+=(--generate-notes)
            fi
            gh release create "$TAG" --title "$title" "${flags[@]}"
          fi
          gh release upload "$TAG" packages/* --clobber
